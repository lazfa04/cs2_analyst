# Red-team set for the judge: conclusions and summaries with KNOWN right answers.
#
# The human labels are 90%+ "fair", so a judge that approves everything scores well on them.
# This set has deliberately bad conclusions mixed with fair ones, so it can measure whether the
# judge actually rejects what it should, and whether it catches planted mistakes in summaries.
#
# Every fact here is real (from the Spirit vs Falcons demos). Each case is one mini-answer:
#   facts           verified facts, referred to as f1, f2, ... in order
#   interpretation  a conclusion resting on some facts, with the right verdict (expected) and why
#   summary         the text shown to the user
#   planted         mistakes planted in the summary; `match` lists phrases, any of which in the judge's
#                   flagged statement counts as catching it. No planted entries = a clean summary.
#
# Categories of bad conclusions:
#   overreach        says more than the facts show ("dominated" with an even record)
#   contradicts      conflicts with a fact
#   unmeasured       a role, intent, decision-making or positioning the stats don't measure
#   one_event        a pattern or rule from one match or a handful of events
#   causal           a cause the facts don't show
#
# Edit `expected` if you disagree with a verdict: this file is the answer key.
#
# Tiers: "easy" cases are blatant mistakes a judge must never miss. "hard" cases are subtle: real
# conclusions the judge got wrong against the expert labels, plausible-sounding overreach, and causes
# the facts almost-but-don't support. The first run scored 100% on easy, so hard is where judges differ.

[[case]]
id = "m0nesy-utility"
facts = [
  "m0NESY threw 63 grenades in 30 rounds: 21 smokes, 22 flashes, 5 HE, 15 molotovs.",
  "His 22 flashes were the most on the team.",
  "His flashes blinded 12 enemies for 2.26s on average, with 0 flash assists.",
  "He dealt only 3 utility damage.",
  "He flashed teammates for 1.5s or more 3 times, with 0 costly team flashes.",
]
summary = "m0NESY threw 63 grenades, including 22 flashes, the most on his team. They blinded 12 enemies for 2.26s on average and set up 4 flash assists. He dealt only 3 utility damage."

[[case.interpretation]]
text = "He contributed with utility mostly through flashes rather than grenade damage."
supports = ["f2", "f3", "f4"]
expected = true
category = "fair"

[[case.interpretation]]
text = "He was the team's in-game leader, calling the executes with his flashes."
supports = ["f2"]
expected = false
category = "unmeasured"
why = "Nothing in the facts measures who calls the strats."

[[case.interpretation]]
text = "His team flashes regularly got teammates killed."
supports = ["f5"]
expected = false
category = "contradicts"
why = "0 costly team flashes."

[[case.planted]]
kind = "contradicted"
match = ["4 flash assist", "flash assists"]
why = "The facts say 0 flash assists."

