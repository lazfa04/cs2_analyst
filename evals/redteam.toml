[[case]]
id = "teses-openings"
facts = [
  "TeSeS took 8 opening duels, winning 4 and losing 4.",
  "On CT he won 3 of 5 opening duels; on T he won 1 of 3.",
  "Falcons won all 4 rounds after he won the opening duel, and 2 of the 4 after he lost it.",
]
summary = "TeSeS went 4 for 8 in opening duels, 3 of 5 on CT and 1 of 3 on T. Falcons won all 4 rounds where he won the opening duel."

[[case.interpretation]]
text = "His opening wins were valuable: the team won every round where he got the first kill."
supports = ["f3"]
expected = true
category = "fair"

[[case.interpretation]]
text = "He dominated the opening duels all match."
supports = ["f1"]
expected = false
category = "overreach"
why = "4-4 is an even record, not domination."

[[case.interpretation]]
text = "He is a much better entry on CT than on T and should only play CT entry spots."
supports = ["f2"]
expected = false
category = "one_event"
why = "3 of 5 vs 1 of 3 in one match is far too few duels for a rule like that."

