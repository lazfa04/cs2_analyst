# The eval set: every question runs against every demo (demos x questions = cases).
# Keep it stable between runs. `eval compare` only compares the cases both runs answered, so adding
# questions doesn't break comparisons with older runs.
#
# `file` is a full path or a name inside CS2_DEMO_DIR. `player` fills {player} in the questions.

# ---------------------------------------------------------------- demos

[[demo]]
name = "d2"
file = "d2.dem"
player = "v1zal"

[[demo]]
name = "anubis"
file = "anubis.dem"
player = "v1zal"

# Public pro demo (B8 vs Vitality, Mirage), so anyone can reproduce the numbers:
# https://github.com/pnxenopoulos/awpy-fixtures/releases/download/hltv-de_mirage-2394170/hltv-de_mirage-2394170.dem
[[demo]]
name = "vitality-b8-mirage"
file = "hltv-de_mirage-2394170.dem"
player = "ZywOo"

# Falcons: Spirit vs Falcons, all three maps
[[demo]]
name = "falcons-map1"
file = "spirit-vs-falcons-m1-anubis.dem"
player = "m0NESY"

[[demo]]
name = "falcons-map2"
file = "spirit-vs-falcons-m2-mirage.dem"
player = "NiKo"

[[demo]]
name = "falcons-map3"
file = "spirit-vs-falcons-m3-dust2.dem"
player = "TeSeS"

# ---------------------------------------------------------------- questions

[[question]]
id = "overview"
text = "How did {player} play this match?"

[[question]]
id = "result"
text = "Why did {player}'s team win or lose this match?"

[[question]]
id = "trades"
text = "Which of {player}'s deaths weren't traded by a teammate?"

[[question]]
id = "utility"
text = "How was {player}'s utility usage?"

[[question]]
id = "openings"
text = "How did {player} do in opening duels, and did the team convert them into round wins?"

[[question]]
id = "best"
text = "Who was the best player on each team, and why?"

# Added after the Falcons eval: questions that need counting, which is where answers went wrong.
[[question]]
id = "killers"
text = "Who killed {player} most often, and did {player} die more on CT or T side?"

[[question]]
id = "clutches"
text = "How did {player} do in clutches? Go through each one."

[[question]]
id = "support"
text = "Did {player} do a support job with utility? Compare their grenades with their teammates'."

[[question]]
id = "flow"
text = "How did the match go half by half, and did economy decide it?"
